[project]
name = "flypilot"
version = "0.1.0"
description = "FlyPilot: a connectome-wired looming-escape circuit as a drone's vision system (Bio-Inspired Engineering EL, RVCE)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pyyaml>=6.0",
    "pybullet>=3.2.5",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Local machine uses CPU-only PyTorch (small install). CNN training runs on Colab's A100.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
