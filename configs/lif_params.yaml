# Leaky integrate-and-fire constants (Phase 4). Fixed published values, not tuned (decisions_log 21).
# Source for every value: Shiu et al. (2024), Nature 634, 210-219, whole-brain fly LIF model,
# checked against the authors' code (github.com/philshiu/Drosophila_brain_model, model.py, default_params).
# Their inline citations for each value are repeated below.

dt_ms: 0.1                  # our integration step (Euler); the code's default Brian2 step is also 0.1 ms

neuron:
  v_rest_mV: -52.0          # Kakaria and de Bivort 2017, doi 10.3389/fnbeh.2017.00008
  v_reset_mV: -52.0         # same
  v_thresh_mV: -45.0        # same
  tau_mem_ms: 20.0          # same (capacitance x resistance)
  t_refrac_ms: 2.2          # Lazar et al. 2021, doi 10.7554/eLife.62362

synapse:
  tau_syn_ms: 5.0           # Jurgensen et al. 2021, doi 10.1088/2634-4386/ac3ba6 (alpha-type synapse; here a decaying current)
  t_delay_ms: 1.8           # Paul et al. 2015, doi 10.3389/fncel.2015.00029
  w_syn_mV: 0.275           # Shiu et al.'s only free parameter. PLACEHOLDER for our one global scale,
                            # which Phase 6 tunes once on the calibration set and then freezes.

# Equations (same as the source model):
#   dv/dt = (v_rest - v + g + i_ext) / tau_mem   (frozen while refractory)
#   dg/dt = -g / tau_syn                         (frozen while refractory)
#   on a spike: v = v_reset, g = 0; after t_delay each target gets g += sign * syn_count * w_syn
# i_ext is our addition: a direct depolarising input in mV, used for tests and for the stimulus drive.
# Sign: acetylcholine +1, GABA -1, glutamate -1 (locked decision 3).
